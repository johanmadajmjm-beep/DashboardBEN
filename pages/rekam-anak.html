<!DOCTYPE html>
<html lang="id">
<head>
  <style>html,body{background:#F8FAFC}</style>
  <script>if("startViewTransition" in document){addEventListener("pagereveal",e=>{if(e.viewTransition)e.viewTransition.ready.catch(()=>{})})}</script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Rekam Anak | MEL NLR Indonesia</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <style>
    /* ── LAYOUT ── */
    .ra-wrap{display:flex;height:calc(100vh - 56px);overflow:hidden}
    /* List panel: full width saat detail belum dibuka */
    .ra-list-panel{
      width:100%;background:#fff;
      border-right:1px solid #E5E7EB;
      display:flex;flex-direction:column;
      transition:width .25s cubic-bezier(.4,0,.2,1);
    }
    .ra-wrap.detail-open .ra-list-panel{width:320px;flex-shrink:0}
    /* Detail panel: tersembunyi default, muncul saat anak diklik */
    .ra-detail-panel{
      width:0;flex-shrink:0;overflow:hidden;background:#F8FAFC;
      border-left:0 solid #E5E7EB;
      transition:width .25s cubic-bezier(.4,0,.2,1);
    }
    .ra-wrap.detail-open .ra-detail-panel{
      width:calc(100% - 320px);
      border-left-width:1px;
      overflow-y:auto;
    }
    .ra-detail-panel::-webkit-scrollbar{width:4px}
    .ra-detail-panel::-webkit-scrollbar-thumb{background:#E5E7EB;border-radius:2px}

    /* ── TOOLBAR ── */
    .ra-toolbar{
      padding:8px 12px;border-bottom:1px solid #E5E7EB;
      flex-shrink:0;background:#fff;
      display:flex;align-items:center;gap:7px;flex-wrap:nowrap;
    }
    .ra-search-wrap{position:relative;flex:2;min-width:0}
    .ra-search{
      width:100%;padding:6px 10px 6px 30px;
      border:1px solid #E5E7EB;border-radius:7px;
      font-size:.75rem;font-family:inherit;outline:none;
      background:#F8FAFC;color:#1F2937;box-sizing:border-box;
    }
    .ra-search:focus{border-color:#F97316;background:#fff}
    .ra-search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:#9CA3AF;pointer-events:none}
    .ra-filters{display:contents}
    .ra-select{
      flex:1;min-width:0;padding:6px 8px;
      border:1px solid #E5E7EB;border-radius:7px;
      font-size:.72rem;font-family:inherit;
      background:#fff;color:#374151;outline:none;cursor:pointer;
    }
    .ra-select:focus{border-color:#F97316}

    /* ── SEGMENT ── */
    .ra-seg{display:flex;gap:2px;flex-shrink:0}
    .ra-seg-btn{
      width:30px;height:30px;padding:0;
      border:1px solid #E5E7EB;border-radius:6px;
      background:#fff;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:.12s;
    }
    .ra-seg-btn.active{background:#FFF7ED;border-color:#F97316;color:#F97316}
    .ra-seg-btn svg{width:13px;height:13px;color:#6B7280}
    .ra-seg-btn.active svg{color:#F97316}

    /* ── COUNT ── */
    .ra-count{padding:6px 12px;font-size:.65rem;color:#9CA3AF;border-bottom:1px solid #F3F4F6;flex-shrink:0;background:#fff}

    /* ── LIST ── */
    .ra-list{flex:1;overflow-y:auto}
    .ra-list::-webkit-scrollbar{width:3px}
    .ra-list::-webkit-scrollbar-thumb{background:#F3F4F6}

    /* ── ITEM VIEWS ── */
    /* XL */
    .ra-item-xl{padding:10px 12px;border-bottom:1px solid #F9FAFB;cursor:pointer;transition:background .1s;display:flex;align-items:flex-start;gap:10px}
    .ra-item-xl:hover{background:#FFF7ED}
    .ra-item-xl.active{background:#FFF7ED;border-left:3px solid #F97316}
    .ra-avatar{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;flex-shrink:0;background:#FFF7ED;color:#F97316}
    .ra-item-xl-body{flex:1;min-width:0}
    .ra-item-name{font-size:.78rem;font-weight:700;color:#1F2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ra-item-meta{font-size:.63rem;color:#9CA3AF;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
    .ra-item-skor{font-size:.7rem;font-weight:800;margin-top:4px}
    .ra-item-chips{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
    .ra-chip{padding:1px 7px;border-radius:999px;font-size:.58rem;font-weight:700}

    /* MD */
    .ra-item-md{padding:8px 12px;border-bottom:1px solid #F9FAFB;cursor:pointer;transition:background .1s;display:flex;align-items:center;gap:9px}
    .ra-item-md:hover{background:#FFF7ED}
    .ra-item-md.active{background:#FFF7ED;border-left:3px solid #F97316}
    .ra-avatar-md{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;flex-shrink:0;background:#FFF7ED;color:#F97316}
    .ra-item-md-body{flex:1;min-width:0}
    .ra-item-md-name{font-size:.75rem;font-weight:700;color:#1F2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ra-item-md-sub{font-size:.62rem;color:#9CA3AF;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* SM */
    .ra-item-sm{padding:6px 12px;border-bottom:1px solid #F9FAFB;cursor:pointer;transition:background .1s;display:flex;align-items:center;gap:8px}
    .ra-item-sm:hover{background:#FFF7ED}
    .ra-item-sm.active{background:#FFF7ED;border-left:3px solid #F97316}
    .ra-item-sm-name{font-size:.73rem;font-weight:600;color:#1F2937;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ra-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

    /* LST */
    .ra-item-lst{padding:5px 12px;border-bottom:1px solid #F9FAFB;cursor:pointer;transition:background .1s;display:flex;align-items:center;gap:6px}
    .ra-item-lst:hover{background:#FFF7ED}
    .ra-item-lst.active{background:#FFF7ED;border-left:3px solid #F97316}
    .ra-item-lst-name{font-size:.7rem;color:#374151;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ra-item-lst-skor{font-size:.68rem;font-weight:700;width:24px;text-align:right;flex-shrink:0}

    /* ── DETAIL ── */
    .ra-empty-detail{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#9CA3AF;gap:12px}

    /* ── FORM TABS ── */
    .ra-tabs{display:flex;gap:0;border-bottom:2px solid #E5E7EB;background:#fff;flex-shrink:0;overflow-x:auto;padding:0 16px;position:sticky;top:0;z-index:5}
    .ra-tab-btn{
      display:flex;align-items:center;gap:5px;
      padding:10px 14px;font-size:.72rem;font-weight:600;
      border:none;border-bottom:3px solid transparent;
      background:none;cursor:pointer;font-family:inherit;
      color:#94A3B8;white-space:nowrap;flex-shrink:0;
      margin-bottom:-2px;transition:all .15s;
    }
    .ra-tab-btn:hover{color:#374151}
    .ra-tab-btn.has{color:#15803d}
    .ra-tab-btn.has:hover{color:#15803d}
    .ra-tab-btn.active{border-bottom-color:#F97316;color:#F97316}
    .ra-tab-btn.active.has{border-bottom-color:#15803d;color:#15803d}
    .ra-tab-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .ra-tab-dot.has{background:#15803d}
    .ra-tab-dot.no{background:#D1D5DB}
    .ra-tab-pane{display:none;padding:16px 20px}
    .ra-tab-pane.active{display:block}

    /* ── CLOSE BTN ── */
    .ra-detail-header-bar{
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 16px 0;flex-shrink:0;
    }
    .ra-close-btn{
      padding:5px 10px;border:1px solid #E5E7EB;border-radius:7px;
      background:#fff;cursor:pointer;color:#6B7280;
      display:flex;align-items:center;gap:5px;
      font-size:.7rem;font-family:inherit;transition:.12s;
    }
    .ra-close-btn:hover{background:#F9FAFB;color:#1F2937}
    .ra-close-btn svg{width:12px;height:12px}
    .ra-pdf-btn{
      padding:5px 10px;border:1px solid #FDBA74;border-radius:7px;
      background:#FFF7ED;cursor:pointer;color:#EA580C;
      display:flex;align-items:center;gap:5px;
      font-size:.7rem;font-weight:700;font-family:inherit;transition:.12s;
    }
    .ra-pdf-btn:hover{background:#FFEDD5;color:#C2410C}
    .ra-pdf-btn:disabled{opacity:.55;cursor:wait}
    .ra-pdf-btn svg{width:12px;height:12px}
    .ra-detail-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
    /* Baris count + tombol export massal */
    .ra-count-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
    .ra-bulk-btn{
      display:flex;align-items:center;gap:6px;flex-shrink:0;
      padding:6px 11px;border:1px solid #F97316;border-radius:8px;
      background:#F97316;color:#fff;cursor:pointer;
      font-size:.7rem;font-weight:700;font-family:inherit;transition:.12s;
    }
    .ra-bulk-btn:hover{background:#EA580C;border-color:#EA580C}
    .ra-bulk-btn:disabled{opacity:.55;cursor:wait}
    .ra-bulk-btn svg{width:13px;height:13px}
    /* Modal progress export massal */
    #ra-bulk-modal{position:fixed;inset:0;z-index:9999;display:none;font-family:inherit}
    #ra-bulk-modal .ra-bulk-backdrop{position:absolute;inset:0;background:rgba(15,23,42,.45)}
    #ra-bulk-modal .ra-bulk-card{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:min(90vw,360px);background:#fff;border-radius:14px;padding:20px 22px;
      box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center;
    }
    #ra-bulk-modal .ra-bulk-title{font-size:.9rem;font-weight:800;color:#1F2937}
    #ra-bulk-modal .ra-bulk-sub{font-size:.72rem;color:#6B7280;margin-top:4px;min-height:1em;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #ra-bulk-modal .ra-bulk-bar{height:8px;background:#F1F5F9;border-radius:999px;overflow:hidden;margin:14px 0 8px}
    #ra-bulk-modal .ra-bulk-fill{height:100%;width:0;background:#F97316;border-radius:999px;transition:width .2s}
    #ra-bulk-modal .ra-bulk-hint{font-size:.62rem;color:#9CA3AF}
    .ra-empty-detail svg{width:48px;height:48px;opacity:.2}
    .ra-empty-detail p{font-size:.8rem}

    .ra-detail-inner{padding:20px 24px}
    .ra-detail-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #E5E7EB}
    .ra-detail-avatar{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;flex-shrink:0;background:#FFF7ED;color:#F97316}
    .ra-detail-name{font-size:1.1rem;font-weight:800;color:#1F2937;margin-bottom:4px}
    .ra-detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .ra-meta-tag{padding:3px 10px;border-radius:6px;font-size:.65rem;font-weight:700;background:#F3F4F6;color:#374151}
    .ra-skor-row{display:flex;gap:10px;flex-wrap:wrap}
    .ra-skor-box{background:#F8FAFC;border-radius:8px;padding:8px 14px;text-align:center}
    .ra-skor-val{font-size:1.3rem;font-weight:800;line-height:1}
    .ra-skor-lbl{font-size:.58rem;color:#9CA3AF;font-weight:600;text-transform:uppercase;margin-top:2px}

    /* ── FORM BADGES (header) ── */
    .ra-form-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
    .ra-form-badge{padding:4px 10px;border-radius:999px;font-size:.65rem;font-weight:700;display:flex;align-items:center;gap:4px}
    .ra-form-badge.has{background:#DCFCE7;color:#15803D}
    .ra-form-badge.no{background:#F1F5F9;color:#94A3B8}

    /* ── ACCORDION ── */
    .acc{background:#fff;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;margin-bottom:10px}
    .acc-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none;transition:background .1s}
    .acc-head:hover{background:#F9FAFB}
    .acc-head-left{display:flex;align-items:center;gap:10px}
    .acc-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
    .acc-title{font-size:.82rem;font-weight:700;color:#1F2937}
    .acc-badge{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:999px}
    .acc-chevron{width:16px;height:16px;color:#9CA3AF;transition:transform .2s;flex-shrink:0}
    .acc-chevron.open{transform:rotate(180deg)}
    .acc-body{display:none;border-top:1px solid #F3F4F6}
    .acc-body.open{display:block}
    .acc-body-inner{padding:14px 16px}

    /* ── FIELD ROWS ── */
    .f-row{display:flex;gap:10px;margin-bottom:8px;font-size:.75rem;line-height:1.6}
    .f-row:last-child{margin-bottom:0}
    .f-lbl{color:#9CA3AF;font-weight:600;min-width:140px;flex-shrink:0}
    .f-val{color:#1F2937;flex:1}
    .f-quote{background:#F8FAFC;border-left:3px solid #F97316;padding:8px 12px;border-radius:0 8px 8px 0;font-size:.74rem;color:#374151;line-height:1.7;margin:6px 0}
    .f-divider{border:none;border-top:1px solid #F3F4F6;margin:12px 0}
    .f-section{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#9CA3AF;margin:10px 0 6px}
    .f-empty{font-size:.73rem;color:#CBD5E1;font-style:italic}

    /* ── TUJUAN ── */
    .tujuan-card{background:#F8FAFC;border-radius:8px;padding:10px 12px;margin-bottom:8px;border-left:3px solid #F97316}
    .tujuan-title{font-size:.7rem;font-weight:800;color:#F97316;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
    .tujuan-val{font-size:.76rem;color:#1F2937;line-height:1.6}
    .tujuan-aktor{font-size:.67rem;color:#6B7280;margin-top:5px}

    /* ── DIARY ── */
    .diary-item{border-bottom:1px solid #F3F4F6;padding:8px 0}
    .diary-item:last-child{border-bottom:none}
    .diary-tgl{font-size:.63rem;font-weight:700;color:#F97316;margin-bottom:3px}
    .diary-isi{font-size:.74rem;color:#374151;line-height:1.6}

    /* ── EVAL ── */
    .eval-item{background:#F8FAFC;border-radius:8px;padding:10px 12px;margin-bottom:8px}
    .eval-tujuan{font-size:.65rem;font-weight:800;color:#64748B;text-transform:uppercase;margin-bottom:5px}
    .eval-skor{font-size:1.1rem;font-weight:800;margin-bottom:4px}
    .eval-field{font-size:.73rem;color:#374151;line-height:1.6;margin-bottom:3px}
    .eval-field span{color:#9CA3AF;font-weight:600}

    /* ── AKTOR GRID ── */
    .aktor-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
    .aktor-pill{padding:2px 8px;border-radius:999px;font-size:.63rem;font-weight:600;background:#EFF6FF;color:#1D4ED8}

    /* ── EMPTY LIST ── */
    .ra-list-empty{padding:24px;text-align:center;color:#9CA3AF;font-size:.76rem}

    /* ── TOPBAR TOGGLE ── */
    .ra-toggle-btn{padding:5px 8px;border:1px solid #E5E7EB;border-radius:7px;background:#fff;cursor:pointer;color:#6B7280;display:flex;align-items:center;gap:5px;font-size:.72rem;font-family:inherit;transition:.12s}
    .ra-toggle-btn:hover{background:#F9FAFB}
  </style>
</head>
<body>
<div class="app"><div class="main">
<header class="topbar">
  <div class="topbar-left">
    <button class="topbar-menu-btn" onclick="openSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="topbar-breadcrumb">CBR <span class="sep">›</span><span class="current">Rekam Anak</span></div>
  </div>
  <div class="topbar-right">
    <span class="scn-badge" id="scn-badge">—</span>
    <span id="data-source-badge" style="font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:999px;display:none"></span>
    <span class="topbar-date" id="topbar-date">—</span>
  </div>
</header>

<div class="ra-wrap" id="ra-wrap">
  <!-- LIST PANEL -->
  <div class="ra-list-panel" id="ra-list-panel">

    <!-- TOOLBAR — 1 baris -->
    <div class="ra-toolbar">
      <div class="ra-search-wrap">
        <svg class="ra-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="ra-search" id="ra-search" type="text" placeholder="Cari nama anak..." oninput="applyFilter()"/>
      </div>
      <div class="ra-filters">
        <select class="ra-select" id="flt-cbr" onchange="applyFilter()">
          <option value="">Semua CBR Worker</option>
        </select>
        <select class="ra-select" id="flt-ragam" onchange="onRagamChange()">
          <option value="">Semua Ragam</option>
          <option>Fisik</option>
          <option>Intelektual</option>
          <option value="Sensorik (penglihatan)">Sensorik (penglihatan)</option>
          <option value="Sensorik (pendengaran dan bicara)">Sensorik (pendengaran & bicara)</option>
          <option>Ganda</option>
          <option>Lainnya</option>
        </select>
        <select class="ra-select" id="flt-detail" onchange="applyFilter()" style="display:none">
          <option value="">Semua Detail</option>
        </select>
      </div>
      <div class="ra-seg">
        <button class="ra-seg-btn active" id="seg-xl" onclick="setView('xl')" title="XL">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
        <button class="ra-seg-btn" id="seg-md" onclick="setView('md')" title="MD">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
        <button class="ra-seg-btn" id="seg-sm" onclick="setView('sm')" title="SM">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="ra-seg-btn" id="seg-lst" onclick="setView('lst')" title="List">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="15" y2="6"/><line x1="3" y1="18" x2="15" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- COUNT + EXPORT MASSAL -->
    <div class="ra-count-bar">
      <div class="ra-count" id="ra-count">Memuat...</div>
      <button class="ra-bulk-btn" id="ra-bulk-btn" onclick="exportAllPDF()"
              title="Export PDF semua anak (mengikuti filter aktif), dikelompokkan jadi 1 ZIP per CBR worker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span id="ra-bulk-lbl">Export ZIP</span>
      </button>
    </div>

    <!-- LIST -->
    <div class="ra-list" id="ra-list"></div>
  </div>

  <!-- DETAIL PANEL — tersembunyi, muncul saat anak diklik -->
  <div class="ra-detail-panel" id="ra-detail"></div>
</div>
</div></div>

<script src="../js/auth.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/api.js"></script>
<!-- Library PDF (khusus halaman ini) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ── STATE ──────────────────────────────────────────────────────
let ALL_DATA   = null;
let ALL_ANAK   = [];   // union unik dari 6 form
let FILTERED   = [];
let ACTIVE_IDX = null;
let CURR_VIEW  = 'xl';
let MY_ROLE    = '';
let MY_CBR     = '';
let CURRENT_ANAK  = null;   // anak yang sedang dibuka di detail panel
let CURRENT_FORMS = null;   // {hasAwal, obs, plan, diary, evalM, evalA}

// ── KONSTANTA WARNA ────────────────────────────────────────────
const RC = {
  'Fisik':'#F97316','Intelektual':'#2563eb',
  'Sensorik (penglihatan)':'#16a34a',
  'Sensorik (pendengaran dan bicara)':'#d97706',
  'Ganda':'#7c3aed','Lainnya':'#94a3b8'
};
const LC = {
  'Parah (dukungan penuh)':'#dc2626',
  'Sedang (dukungan reguler)':'#d97706',
  'Rendah (sedikit dukungan)':'#16a34a'
};

function scColor(v){ return v<=3?'#dc2626':v<=5?'#d97706':v<=7?'#f59e0b':'#16a34a'; }
function scBg(v){ return v<=3?'#fee2e2':v<=5?'#fef3c7':v<=7?'#fffbeb':'#dcfce7'; }
function inits(nama){ return (nama||'?').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase(); }

// Kunci nama ternormalisasi untuk cocokkan antar-sheet (DataAwal, Rencana, Diary, Eval).
// Tahan terhadap beda huruf besar/kecil, spasi ganda, dan beda tanda baca.
function normNama(s){
  return (s||'').toString().toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,' ').trim();
}

// Hitung jumlah form yang dimiliki anak (0–6)
function countForms(a) {
  const d = ALL_DATA;
  if (!d) return 0;
  const k = normNama(a.nama);
  let n = 0;
  if (a._sumber==='DataAwal' || a.sp!=null || a.ragam!=='—') n++;
  if ((d.obs||[]).some(o=>normNama(o.na)===k)) n++;
  if ((d.perencanaan||[]).some(r=>normNama(r.nama_anak||r.na)===k)) n++;
  if ((d.diary||[]).some(r=>normNama(r.nama_anak||r.na)===k)) n++;
  if ((d.evalMenengah||[]).some(r=>normNama(r.nama_anak||r.na)===k)) n++;
  if ((d.evalAkhir||[]).some(r=>normNama(r.nama_anak||r.na)===k)) n++;
  return n;
}

function formColor(n) {
  return n>=6?'#15803d':n>=4?'#F97316':n>=2?'#d97706':'#dc2626';
}

// ── BUILD UNION ANAK ───────────────────────────────────────────
// Union unik nama dari 6 form, DataAwal sebagai master data
function buildUnionAnak(d) {
  const map = {}; // key: nama lowercase

  // DataAwal — sumber data lengkap
  (d.anak||[]).forEach(a => {
    const k = normNama(a.nama);
    if (!k) return;
    map[k] = { ...a, _sumber:'DataAwal' };
  });

  // 5 form lain — tambah anak yang belum ada di DataAwal
  function addFrom(arr, label) {
    arr.forEach(r => {
      const nama = (r.nama_anak||r.na||r.nama||'').trim();
      const k    = normNama(nama);
      if (!k) return;
      if (!map[k]) {
        map[k] = {
          nama, cbr: r.cbr_worker||r.cb||r.cbr||'—',
          ragam:'—', rgd:'', level:'—', desa:'—',
          gender:'—', usia:null, sp:null, sa:null,
          scn:r.scn||'', _sumber:label
        };
      }
    });
  }
  addFrom(d.obs||[],          'Observasi');
  addFrom(d.perencanaan||[],  'Perencanaan');
  addFrom(d.diary||[],        'Buku Harian');
  addFrom(d.evalMenengah||[], 'Eval Menengah');
  addFrom(d.evalAkhir||[],    'Eval Akhir');

  return Object.values(map).sort((a,b)=>(a.nama||'').localeCompare(b.nama||''));
}

// ── FILTER CBR (untuk worker: hanya tampil anak miliknya) ──────
function filterByRole(anak) {
  if (MY_ROLE === 'worker' && MY_CBR) {
    return anak.filter(a => (a.cbr||'').toLowerCase() === MY_CBR.toLowerCase());
  }
  return anak;
}

// ── RENDER LIST ────────────────────────────────────────────────
function applyFilter() {
  const q       = (document.getElementById('ra-search').value||'').toLowerCase().trim();
  const cbr     = document.getElementById('flt-cbr').value;
  const ragam   = document.getElementById('flt-ragam').value;
  const detail  = document.getElementById('flt-detail').value;

  FILTERED = ALL_ANAK.filter(a => {
    if (q && !(a.nama||'').toLowerCase().includes(q)) return false;
    if (cbr && (a.cbr||'') !== cbr) return false;
    if (ragam && (a.ragam||'') !== ragam) return false;
    if (detail && !(a.rgd||'').includes(detail)) return false;
    return true;
  });

  document.getElementById('ra-count').textContent =
    `${FILTERED.length} dari ${ALL_ANAK.length} anak`;

  renderList();
}

function onRagamChange() {
  const ragam  = document.getElementById('flt-ragam').value;
  const detSel = document.getElementById('flt-detail');
  // Refresh opsi detail sesuai ragam yang dipilih
  refreshDetailOptions(ragam);
  detSel.style.display = ragam ? 'block' : 'none';
  detSel.value = '';
  applyFilter();
}

function renderList() {
  const el = document.getElementById('ra-list');
  if (!FILTERED.length) {
    el.innerHTML = '<div class="ra-list-empty">Tidak ada anak ditemukan</div>';
    return;
  }
  el.innerHTML = FILTERED.map((a,i) => renderItem(a, i)).join('');
}

function renderItem(a, i) {
  const isActive = ACTIVE_IDX === i;
  const ac = isActive ? ' active' : '';
  const rColor = RC[a.ragam]||'#94a3b8';
  const ragamShort = (a.ragam||'—').split(' ')[0];

  if (CURR_VIEW === 'xl') {
    const nForm = countForms(a);
    const fcol  = formColor(nForm);
    return `<div class="ra-item-xl${ac}" onclick="selectAnak(${i})">
      <div class="ra-avatar" style="background:${rColor}18;color:${rColor}">${inits(a.nama)}</div>
      <div class="ra-item-xl-body">
        <div class="ra-item-name">${a.nama}</div>
        <div class="ra-item-meta">
          <span>${a.cbr||'—'}</span>
          ${a.desa&&a.desa!=='—'?`<span>📍 ${a.desa}</span>`:''}
        </div>
        <div class="ra-item-chips">
          <span class="ra-chip" style="background:${rColor}18;color:${rColor}">${ragamShort}</span>
          ${a.level&&a.level!=='—'?`<span class="ra-chip" style="background:${LC[a.level]||'#9ca3af'}18;color:${LC[a.level]||'#9ca3af'}">${a.level.split(' ')[0]}</span>`:''}
          <span class="ra-chip" style="background:${fcol}18;color:${fcol}">${nForm}/6 form</span>
        </div>
      </div>
    </div>`;
  }

  if (CURR_VIEW === 'md') {
    const nFormMd = countForms(a);
    return `<div class="ra-item-md${ac}" onclick="selectAnak(${i})">
      <div class="ra-avatar-md" style="background:${rColor}18;color:${rColor}">${inits(a.nama)}</div>
      <div class="ra-item-md-body">
        <div class="ra-item-md-name">${a.nama}</div>
        <div class="ra-item-md-sub">${a.cbr||'—'} · ${ragamShort} · <span style="color:${formColor(nFormMd)};font-weight:700">${nFormMd}/6 form</span></div>
      </div>
    </div>`;
  }

  if (CURR_VIEW === 'sm') {
    const nFormSm = countForms(a);
    return `<div class="ra-item-sm${ac}" onclick="selectAnak(${i})">
      <div class="ra-dot" style="background:${rColor}"></div>
      <div class="ra-item-sm-name">${a.nama}</div>
      <span style="font-size:.63rem;font-weight:700;color:${formColor(nFormSm)}">${nFormSm}/6</span>
    </div>`;
  }

  // lst
  const nFormLst = countForms(a);
  return `<div class="ra-item-lst${ac}" onclick="selectAnak(${i})">
    <div class="ra-dot" style="background:${rColor}"></div>
    <div class="ra-item-lst-name">${a.nama}</div>
    <div class="ra-item-lst-skor" style="color:${formColor(nFormLst)}">${nFormLst}/6</div>
  </div>`;
}

function setView(v) {
  CURR_VIEW = v;
  ['xl','md','sm','lst'].forEach(s => {
    document.getElementById('seg-'+s).classList.toggle('active', s===v);
  });
  renderList();
}

// ── SELECT ANAK ────────────────────────────────────────────────
function selectAnak(idx) {
  ACTIVE_IDX = idx;
  renderList(); // highlight
  const a = FILTERED[idx];
  if (!a) return;
  renderDetail(a);
  // Scroll anak yang diklik ke tengah list
  setTimeout(() => {
    const activeEl = document.querySelector('.ra-item-xl.active,.ra-item-md.active,.ra-item-sm.active,.ra-item-lst.active');
    if (activeEl) activeEl.scrollIntoView({ block:'nearest', behavior:'smooth' });
  }, 50);
}

let ACTIVE_FORM_TAB = 'awal';

function renderDetail(a) {
  const d = ALL_DATA;
  const k = normNama(a.nama);

  const obsData   = (d.obs||[]).filter(o=>normNama(o.na)===k);
  const planData  = (d.perencanaan||[]).filter(r=>normNama(r.nama_anak||r.na)===k);
  const diaryData = (d.diary||[]).filter(r=>normNama(r.nama_anak||r.na)===k);
  const evalMData = (d.evalMenengah||[]).filter(r=>normNama(r.nama_anak||r.na)===k);
  const evalAData = (d.evalAkhir||[]).filter(r=>normNama(r.nama_anak||r.na)===k);

  const hasAwal = a._sumber==='DataAwal' || a.sp!=null || a.ragam!=='—';
  const rColor  = RC[a.ragam]||'#94a3b8';
  const lColor  = LC[a.level]||'#94a3b8';

  // Simpan konteks anak aktif untuk Export PDF
  CURRENT_ANAK  = a;
  CURRENT_FORMS = { hasAwal, obs:obsData, plan:planData, diary:diaryData, evalM:evalMData, evalA:evalAData };

  // Form tab definiton
  const FORMS = [
    { id:'awal',    label:'Data Awal',      icon:'📋', has: hasAwal },
    { id:'progres', label:'Progres IRP',    icon:'🗂', has: planData.length>0 || evalMData.length>0 || evalAData.length>0 },
    { id:'obs',     label:'Observasi',      icon:'👁',  has: obsData.length>0 },
    { id:'plan',    label:'Perencanaan',    icon:'📝', has: planData.length>0 },
    { id:'diary',   label:'Buku Harian',    icon:'📔', has: diaryData.length>0 },
    { id:'evalm',   label:'Eval. Menengah', icon:'📊', has: evalMData.length>0 },
    { id:'evala',   label:'Eval. Akhir',    icon:'🏁', has: evalAData.length>0 },
  ];

  // Default: buka tab pertama yang punya data, atau Data Awal
  const defaultTab = FORMS.find(f=>f.has)?.id || 'awal';
  ACTIVE_FORM_TAB = defaultTab;

  // Buka panel
  document.getElementById('ra-wrap').classList.add('detail-open');
  const panel = document.getElementById('ra-detail');

  panel.innerHTML = `
    <!-- CLOSE + NAMA -->
    <div class="ra-detail-header-bar">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <div style="width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;flex-shrink:0;background:${rColor}18;color:${rColor}">${inits(a.nama)}</div>
        <div style="min-width:0">
          <div style="font-size:.88rem;font-weight:800;color:#1F2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.nama}</div>
          <div style="font-size:.62rem;color:#9CA3AF;margin-top:1px;display:flex;gap:6px;flex-wrap:wrap">
            ${a.cbr&&a.cbr!=='—'?`<span>👤 ${a.cbr}</span>`:''}
            ${a.ragam&&a.ragam!=='—'?`<span style="color:${rColor}">${a.ragam}</span>`:''}
            ${a.sp!=null?`<span style="color:${scColor(a.sp)};font-weight:700">Skor ${a.sp}/10</span>`:''}
          </div>
        </div>
      </div>
      <div class="ra-detail-actions">
        <button class="ra-pdf-btn" id="ra-pdf-btn" onclick="exportPDF()" title="Unduh laporan rekam anak (PDF)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 18 15 15"/></svg>
          <span id="ra-pdf-lbl">Export PDF</span>
        </button>
        <button class="ra-close-btn" onclick="closeDetail()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Tutup
        </button>
      </div>
    </div>

    <!-- 6 FORM TABS -->
    <div class="ra-tabs" id="ra-tabs">
      ${FORMS.map(f=>`
        <button class="ra-tab-btn ${f.has?'has':''} ${f.id===defaultTab?'active':''}"
          id="ra-tab-${f.id}" onclick="switchFormTab('${f.id}')">
          <span class="ra-tab-dot ${f.has?'has':'no'}"></span>
          ${f.icon} ${f.label}
        </button>`).join('')}
    </div>

    <!-- TAB PANES -->
    <div id="ra-pane-progres" class="ra-tab-pane ${defaultTab==='progres'?'active':''}">${renderProgresIRP(a, obsData, planData, diaryData, evalMData, evalAData)}</div>
    <div id="ra-pane-awal"  class="ra-tab-pane ${defaultTab==='awal' ?'active':''}">${renderDataAwal(a)}</div>
    <div id="ra-pane-obs"   class="ra-tab-pane ${defaultTab==='obs'  ?'active':''}">${renderObservasi(obsData)}</div>
    <div id="ra-pane-plan"  class="ra-tab-pane ${defaultTab==='plan' ?'active':''}">${renderPerencanaan(planData)}</div>
    <div id="ra-pane-diary" class="ra-tab-pane ${defaultTab==='diary'?'active':''}">${renderDiary(diaryData)}</div>
    <div id="ra-pane-evalm" class="ra-tab-pane ${defaultTab==='evalm'?'active':''}">${renderEvalMenengah(evalMData)}</div>
    <div id="ra-pane-evala" class="ra-tab-pane ${defaultTab==='evala'?'active':''}">${renderEvalAkhir(evalAData)}</div>
  `;

function switchFormTab(id) {
  ACTIVE_FORM_TAB = id;
  // Tab buttons
  document.querySelectorAll('.ra-tab-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('ra-tab-'+id);
  if (btn) btn.classList.add('active');
  // Panes
  ['awal','obs','plan','diary','evalm','evala'].forEach(p => {
    const el = document.getElementById('ra-pane-'+p);
    if (el) el.classList.toggle('active', p===id);
  });
  // Scroll to top
  document.getElementById('ra-detail').scrollTop = 0;
}

function closeDetail() {
  document.getElementById('ra-wrap').classList.remove('detail-open');
  const panel = document.getElementById('ra-detail');
  panel.innerHTML = '';
  ACTIVE_IDX = null;
  renderList();
}

function accSection(icon, title, bg, color, badge, badgeType, content) {
  const id = 'acc-' + title.replace(/\s/g,'');
  const isOpen = badgeType === 'has';
  return `<div class="acc">
    <div class="acc-head" onclick="toggleAcc('${id}')">
      <div class="acc-head-left">
        <div class="acc-icon" style="background:${bg};color:${color}">${icon}</div>
        <span class="acc-title">${title}</span>
        <span class="acc-badge" style="background:${badgeType==='has'?bg:'#F1F5F9'};color:${badgeType==='has'?color:'#94A3B8'}">${badge}</span>
      </div>
      <svg class="acc-chevron ${isOpen?'open':''}" id="chev-${id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>
    <div class="acc-body ${isOpen?'open':''}" id="${id}">
      <div class="acc-body-inner">${content}</div>
    </div>
  </div>`;
}

function toggleAcc(id) {
  const body  = document.getElementById(id);
  const chev  = document.getElementById('chev-'+id);
  const isOpen= body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
}

// ── RENDER PER FORM ────────────────────────────────────────────

function frow(lbl, val) {
  if (!val || val==='—' || val==='' || val===null) return '';
  return `<div class="f-row"><span class="f-lbl">${lbl}</span><span class="f-val">${val}</span></div>`;
}

function fquote(val) {
  if (!val || val==='—' || val==='') return '';
  return `<div class="f-quote">${val}</div>`;
}

// ── PROGRES IRP — TIMELINE KRONOLOGIS ─────────────────────────
function renderProgresIRP(a, obsArr, planArr, diaryArr, evalMArr, evalAArr) {
  const sp   = a.sp  != null ? a.sp  : null;
  const sa   = a.sa  != null ? a.sa  : null;
  const spColor = v => v>=7?'#16a34a':v>=5?'#F97316':v>=4?'#d97706':'#dc2626';

  // Susun timeline dari semua event yang ada
  const events = [];

  // Data Awal
  if (a._sumber === 'DataAwal' || a.sp != null) {
    events.push({
      tgl: a.tl || null,
      icon: '📋', color: '#F97316', label: 'Data Awal Terdokumentasi',
      detail: [
        sp!=null ? `Skor anak: <b style="color:${spColor(sp)}">${sp}/10</b>` : null,
        sa!=null ? `Skor pengasuh: <b style="color:${spColor(sa)}">${sa}/10</b>` : null,
        a.ragam && a.ragam!=='—' ? `Ragam: ${a.ragam}` : null,
        a.level && a.level!=='—' ? `Level: ${a.level}` : null,
      ].filter(Boolean)
    });
  }

  // Observasi
  obsArr.forEach(o => {
    events.push({
      tgl: o.tgl || null,
      icon: '👁', color: '#2563eb', label: 'Observasi ICF',
      detail: [
        o.st ? `Struktur Tubuh: ${o.st.substring(0,80)}${o.st.length>80?'…':''}` : null,
        o.kg ? `Kegiatan: ${o.kg.substring(0,80)}${o.kg.length>80?'…':''}` : null,
        o.lg ? `Lingkungan: ${o.lg.substring(0,80)}${o.lg.length>80?'…':''}` : null,
      ].filter(Boolean)
    });
  });

  // Perencanaan
  planArr.forEach(p => {
    const tujuan = [p.tujuan_1, p.tujuan_2, p.tujuan_3].filter(Boolean);
    events.push({
      tgl: p.tanggal_rencana || p.tanggal_submit || null,
      icon: '📝', color: '#16a34a', label: 'Perencanaan IRP Disusun',
      detail: tujuan.map((t,i) => `Tujuan ${i+1}: ${t.substring(0,100)}${t.length>100?'…':''}`)
    });
  });

  // Buku Harian — ringkas per submission
  diaryArr.forEach(d => {
    const entries = [];
    for (let i=1; i<=10; i++) {
      const tgl = d['tgl_diary_'+i], isi = d['isi_diary_'+i];
      if (tgl||isi) entries.push((tgl||'')+': '+(isi||'').substring(0,60));
    }
    events.push({
      tgl: d.tanggal_submit || null,
      icon: '📔', color: '#9333ea', label: 'Buku Harian Dicatat',
      detail: entries.slice(0,3).concat(entries.length>3?[`...dan ${entries.length-3} entri lainnya`]:[])
    });
  });

  // Evaluasi Menengah
  evalMArr.forEach(e => {
    const skor1 = parseFloat(e.score_tujuan_1)||null;
    const skor2 = parseFloat(e.score_tujuan_2)||null;
    const skor3 = parseFloat(e.score_tujuan_3)||null;
    events.push({
      tgl: e.tanggal_eval || e.tanggal_submit || null,
      icon: '📊', color: '#d97706', label: 'Evaluasi Menengah',
      detail: [
        skor1!=null ? `Skor Tujuan 1: <b style="color:${spColor(skor1)}">${skor1}/10</b>` : null,
        skor2!=null ? `Skor Tujuan 2: <b style="color:${spColor(skor2)}">${skor2}/10</b>` : null,
        skor3!=null ? `Skor Tujuan 3: <b style="color:${spColor(skor3)}">${skor3}/10</b>` : null,
        e.perubahan_1 ? `Perubahan: ${(e.perubahan_1||'').substring(0,100)}` : null,
      ].filter(Boolean)
    });
  });

  // Evaluasi Akhir
  evalAArr.forEach(e => {
    const t1 = (e.tercapai_tujuan_1||'').toLowerCase();
    const t2 = (e.tercapai_tujuan_2||'').toLowerCase();
    const t3 = (e.tercapai_tujuan_3||'').toLowerCase();
    const tercapai = [t1,t2,t3].filter(v=>v==='ya').length;
    const total    = [t1,t2,t3].filter(Boolean).length;
    events.push({
      tgl: e.tanggal_eval || e.tanggal_submit || null,
      icon: '🏁', color: '#059669', label: 'Evaluasi Akhir',
      detail: [
        total>0 ? `Tujuan tercapai: <b style="color:${tercapai===total?'#059669':'#dc2626'}">${tercapai} dari ${total}</b>` : null,
        e.penjelasan_ya_1 ? `Penjelasan: ${(e.penjelasan_ya_1||'').substring(0,100)}` : null,
        e.saran_1 ? `Saran: ${(e.saran_1||'').substring(0,100)}` : null,
      ].filter(Boolean)
    });
  });

  // Urutkan berdasarkan tanggal
  events.sort((a,b) => {
    if (!a.tgl && !b.tgl) return 0;
    if (!a.tgl) return 1;
    if (!b.tgl) return -1;
    return a.tgl.localeCompare(b.tgl);
  });

  if (!events.length) {
    return `<div class="f-empty">Belum ada data progres untuk anak ini.</div>`;
  }

  // Hitung % siklus selesai
  const steps = [
    { label:'Data Awal', done: a._sumber==='DataAwal'||a.sp!=null },
    { label:'Observasi', done: obsArr.length>0 },
    { label:'Perencanaan', done: planArr.length>0 },
    { label:'Buku Harian', done: diaryArr.length>0 },
    { label:'Eval. Menengah', done: evalMArr.length>0 },
    { label:'Eval. Akhir', done: evalAArr.length>0 },
  ];
  const doneCount = steps.filter(s=>s.done).length;
  const pct = Math.round(doneCount/steps.length*100);
  const pctColor = pct===100?'#059669':pct>=67?'#F97316':pct>=33?'#d97706':'#dc2626';

  return `
    <!-- PROGRESS BAR SIKLUS -->

function hasKwRA(text,kws){ if(!text)return false; const t=String(text).toLowerCase(); return kws.some(k=>t.includes(k)); }
function getAllTeksRA(a,obs){
  return [a.nka||'',a.tka||'',a.nkp||'',a.tkp||'',
    obs?obs.st||'':'',obs?obs.kg||'':'',obs?obs.pf||'':'',obs?obs.lg||'':''].join(' ');
}
function buildKatTemuanRA(kat,a,obs){
  const rule=RULES_KAT_RA[kat];
  const all=getAllTeksRA(a,obs);
  const facts=[];
  if(kat==='kesehatan'){
    if(a.ep)facts.push('Epilepsi aktif');
    if(!a.ob)facts.push('Tidak ada pengobatan rutin');
    if(!a.tr&&(a.level||'').includes('Parah'))facts.push('Belum mendapat terapi meski level parah');
  }
  if(!hasKwRA(all,rule.kw)&&!facts.length)return null;
  const sources=[a.nka||'',a.tka||'',a.nkp||'',a.tkp||'',
    obs?obs.st||'':'',obs?obs.kg||'':'',obs?obs.pf||'':'',obs?obs.lg||'':''].filter(Boolean);
  sources.forEach(src=>{
    String(src).replace(/\n/g,'.').split(/[.;]/).forEach(s=>{
      s=s.trim();
      if(s.length>10&&hasKwRA(s,rule.kw)&&facts.length<4)facts.push(s);
    });
  });
  return facts.length?facts.join('; '):null;
}
function buildKatRTLRA(kat,temuan,a){
  const rtl=RULES_KAT_RA[kat].rtlMap;
  const t=(temuan||'').toLowerCase();
  if(kat==='kesehatan'){
    if(a.ep)return rtl.epilepsi;
    if(hasKwRA(t,['pengobatan','tidak ada obat']))return rtl.tidak_obat;
    if(hasKwRA(t,['terapi','fisioterapi']))return rtl.tidak_terapi;
    if(hasKwRA(t,['kursi roda','alat bantu','kacamata']))return rtl.alat_bantu;
    if(hasKwRA(t,['gizi','nutrisi','susu']))return rtl.gizi;
    return rtl.def;
  }
  if(kat==='pendidikan'){
    if(hasKwRA(t,['belum sekolah','tidak sekolah','putus sekolah']))return rtl.belum_sekolah;
    if(hasKwRA(t,['gpk','guru pendamping']))return rtl.gpk;
    return rtl.def;
  }
  if(kat==='penghidupan'){
    if(hasKwRA(t,['pkh','blt','bantuan','sembako','bpjs','dtks']))return rtl.bantuan;
    if(hasKwRA(t,['rumah','dinding','lantai','bambu']))return rtl.rumah;
    return rtl.def;
  }
  if(kat==='sosial'){
    if(hasKwRA(t,['stigma','dikucilkan','bully','ejek']))return rtl.stigma;
    if(hasKwRA(t,['isolasi','sendirian','tidak keluar']))return rtl.isolasi;
    if(hasKwRA(t,['tunggal','janda','duda','merantau','ditinggal']))return rtl.tunggal;
    return rtl.def;
  }
  if(kat==='pemberdayaan'){
    if(hasKwRA(t,['toilet','cebok','mandi','makan','mandiri']))return rtl.kemandirian;
    if(hasKwRA(t,['percaya diri','minder','malu']))return rtl.percaya_diri;
    if(hasKwRA(t,['ktp','akta','dtks','hak']))return rtl.hak;
    return rtl.def;
  }
  return rtl.def||'';
}
function buildKatPihakRA(kat,a,obs){
  const base={
    kesehatan:['dokter_puskesmas','perawat_puskesmas','bidan_desa','kader_posyandu','fisioterapis','dinkes'],
    pendidikan:['guru_kelas','wali_kelas','kepala_sekolah','gpk','guru_paud','dindik','ayo_indonesia'],
    penghidupan:['kepala_desa','kasi_kesra','pkk_desa','dinsos','uptd_sosial','pkh_officer','rt_rw','bpd'],
    sosial:['tua_golo','tokoh_adat','pastor','katekis','kelompok_doa','rt_rw','warga_kampung','tetangga','karang_taruna','omk'],
    pemberdayaan:['ibu','ayah','saudara_kandung','cbr_worker_lain','scn','kader_disabilitas','ayo_indonesia']
  };
  const list=[...base[kat]];
  const all=getAllTeksRA(a,obs).toLowerCase();
  if(kat==='kesehatan'){
    list.push('ibu','ayah');
    if(hasKwRA(all,['epilepsi','kejang']))list.push('dokter_puskesmas','dinkes');
    if(hasKwRA(all,['terapi','fisioterapi']))list.push('fisioterapis','cbm_global','ayo_indonesia');
    if(hasKwRA(all,['kursi roda','alat bantu','standing table']))list.push('dinsos','uptd_sosial','cbm_global');
    if(hasKwRA(all,['gizi','nutrisi','susu']))list.push('kader_posyandu','pkk_desa');
    if(hasKwRA(all,['bpjs','kartu']))list.push('kepala_desa','kasi_kesra');
    if((a.level||'').includes('Parah'))list.push('pastor','tua_golo');
  }
  if(kat==='pendidikan'){
    list.push('ibu','ayah','guru_agama');
    if(hasKwRA(all,['belum sekolah','tidak sekolah']))list.push('kepala_sekolah','dindik','kasi_kesra','kepala_desa');
    if(hasKwRA(all,['slb','sdlb']))list.push('dindik','gpk');
    if(hasKwRA(all,['paud','tk']))list.push('guru_paud','pengelola_paud');
  }
  if(kat==='penghidupan'){
    list.push('ibu','ayah','bpd');
    if(hasKwRA(all,['pkh','blt','bantuan','dtks']))list.push('pkh_officer','kepala_desa','kasi_kesra','dinsos');
    if(hasKwRA(all,['rumah','dinding','lantai','bambu']))list.push('dinsos','uptd_sosial','kepala_desa','karang_taruna');
    if(hasKwRA(all,['panen','kebun','tani','ternak']))list.push('pkk_desa','kelompok_tani');
  }
  if(kat==='sosial'){
    list.push('ibu','ayah','tetangga','pkk_desa');
    if(hasKwRA(all,['stigma','dikucilkan','bully']))list.push('tua_golo','tokoh_adat','pastor','rt_rw','kepala_desa');
    if(hasKwRA(all,['isolasi','sendirian','tidak keluar']))list.push('kelompok_doa','omk','karang_taruna','teman_sebaya');
    if(hasKwRA(all,['tunggal','janda','duda','merantau','ditinggal']))list.push('tua_golo','paman_bibi','kakek_nenek_serumah','rt_rw');
    if(hasKwRA(all,['gereja','pastor','doa','misa']))list.push('pastor','katekis','kelompok_doa');
    if(hasKwRA(all,['adat','tua golo']))list.push('tua_golo','tokoh_adat');
  }
  if(kat==='pemberdayaan'){
    list.push('ibu','ayah','saudara_kandung');
    if(hasKwRA(all,['toilet','cebok','mandi','makan','mandiri']))list.push('bidan_desa','cbr_worker_lain');
    if(hasKwRA(all,['percaya diri','minder','malu']))list.push('guru_kelas','teman_sebaya','pastor','tua_golo');
    if(hasKwRA(all,['ktp','akta','dtks','hak']))list.push('kepala_desa','kasi_kesra','p2tp2a','dinsos');
    if(hasKwRA(all,['keterampilan','pelatihan','vokasi']))list.push('ayo_indonesia','cbm_global','lsm_lokal');
    if((a.level||'').includes('Parah'))list.push('fisioterapis','cbm_global','ayo_indonesia');
  }
  list.push('cbr_worker_lain','scn');
  return [...new Set(list)].map(k=>AKTOR_LABEL_PDF[k]||k);
}
function analyzeRTL(a, obs){
  const result=[];
  ['kesehatan','pendidikan','penghidupan','sosial','pemberdayaan'].forEach(kat=>{
    const temuan=buildKatTemuanRA(kat,a,obs);
    if(!temuan)return;
    result.push({
      kat,
      label: RTL_KAT_LABEL[kat],
      temuan,
      rtl: buildKatRTLRA(kat,temuan,a),
      pihak: buildKatPihakRA(kat,a,obs)
    });
  });
  return result;
}

const PDF_ORANGE = [249,115,22];

function pdfKatColor(kat){
  return ({kesehatan:[220,38,38],pendidikan:[29,78,216],penghidupan:[217,119,6],
           sosial:[124,58,237],pemberdayaan:[5,150,105]}[kat])||PDF_MUTE;

// Bersihkan teks agar rapi di PDF: TAB & aneka spasi Unicode / non-breaking space
// → spasi normal; hapus zero-width; kutip melengkung & dash → ASCII (agar ter-render
// benar oleh Helvetica); rapatkan spasi ganda. Newline nyata dipertahankan.
function pdfText(v){
  if (v == null) return '';
  return String(v)
    .replace(/\r\n?/g, '\n')
    .replace(/\t/g, ' ')
    .replace(/[\u00A0\u1680\u2000-\u200A\u202F\u205F\u3000]/g, ' ')
    .replace(/[\u200B-\u200D\uFEFF\u00AD]/g, '')
    .replace(/[\u2018\u2019\u201A\u201B\u2032]/g, "'")
    .replace(/[\u201C\u201D\u201E\u201F\u2033]/g, '"')
    .replace(/[\u2013\u2014\u2212]/g, '-')
    .replace(/\u2026/g, '...')
    .replace(/[\u2022\u25CF\u25AA\u25E6\u00B7\u2043]/g, '- ')
    .replace(/[ ]{2,}/g, ' ')
    .replace(/[ ]*\n[ ]*/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}
// Hook autotable: sanitasi teks tiap sel sebelum diukur & di-wrap.
function pdfSanitizeCell(d){
  const c = d.cell;
  if (c && c.text != null){
    c.text = Array.isArray(c.text) ? c.text.map(pdfText) : pdfText(c.text);
  }
}

// ── DERIVE FORM DATA per anak (dari data ter-fetch) ────────────
function deriveForms(d, a0){
  const key = normNama(a0.nama);
  const a = (d.anak||[]).find(x=>normNama(x.nama)===key) || a0;
  const F = {
    hasAwal: a._sumber==='DataAwal' || a.sp!=null || (a.ragam && a.ragam!=='—'),
    obs:   (d.obs||[]).filter(o=>normNama(o.na)===key),
    plan:  (d.perencanaan||[]).filter(r=>normNama(r.nama_anak||r.na)===key),
    diary: (d.diary||[]).filter(r=>normNama(r.nama_anak||r.na)===key),
    evalM: (d.evalMenengah||[]).filter(r=>normNama(r.nama_anak||r.na)===key),
    evalA: (d.evalAkhir||[]).filter(r=>normNama(r.nama_anak||r.na)===key),
  };
  return { a, F };
}

          body.push([ 'Tujuan '+n, tc||'—', det||'—' ]);
        });
        doc.autoTable({ ...baseTable, startY:(ei===0?y+4:y+6),
          head:[['Tujuan ('+(e.tanggal_eval||e.tanggal_submit||'—')+')','Tercapai','Uraian']],
          body: body.length?body:[['—','—','Belum diisi']],
          headStyles:{ fillColor:[5,150,105], textColor:255, fontStyle:'bold', fontSize:8 },
          columnStyles:{ 0:{cellWidth:CW*0.14, fontStyle:'bold'}, 1:{cellWidth:CW*0.14, halign:'center'}, 2:{cellWidth:CW*0.72} },
          didParseCell:(d)=>{ pdfSanitizeCell(d); if(d.section==='body'&&d.column.index===1){ const v=String(d.cell.raw||'').toLowerCase(); if(v==='ya'){d.cell.styles.textColor=[22,163,74];d.cell.styles.fontStyle='bold';} else if(v&&v!=='—'){d.cell.styles.textColor=[220,38,38];d.cell.styles.fontStyle='bold';} } },
        });
        afterTable();
      });
    }

    // ── FOOTER SEMUA HALAMAN ───────────────────────────────────
    const now = new Date();
    const tgl = now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear();
    const total = doc.internal.getNumberOfPages();
    for (let p=1; p<=total; p++){
      doc.setPage(p);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...PDF_MUTE);
      doc.setDrawColor(...PDF_BORDER); doc.setLineWidth(.5);
      doc.line(M, PH-30, PW-M, PH-30);
      doc.text('BEN SCN · Rekam Anak: '+(a.nama||'—')+' · Dicetak: '+tgl, M, PH-18);
      doc.text('Halaman '+p+' dari '+total, PW-M, PH-18, { align:'right' });
    }
    return doc;
}

// ── UTIL ───────────────────────────────────────────────────────
function pdfSafeName(s){ return ((s||'x').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'')) || 'x'; }
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const el = document.createElement('a');
  el.href = url; el.download = filename;
  document.body.appendChild(el); el.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); el.remove(); }, 1500);
}
function bulkProgress(show, pct, line1, line2){
  let el = document.getElementById('ra-bulk-modal');
  if (!show){ if (el) el.style.display='none'; return; }
  if (!el){
    el = document.createElement('div');
    el.id = 'ra-bulk-modal';
    el.innerHTML =
      '<div class="ra-bulk-backdrop"></div>' +
      '<div class="ra-bulk-card">' +
        '<div class="ra-bulk-title" id="ra-bulk-l1">Menyiapkan…</div>' +
        '<div class="ra-bulk-sub" id="ra-bulk-l2"></div>' +
        '<div class="ra-bulk-bar"><div class="ra-bulk-fill" id="ra-bulk-fill"></div></div>' +
        '<div class="ra-bulk-hint">Jangan tutup tab ini sampai selesai.</div>' +
      '</div>';
    document.body.appendChild(el);
  }
  el.style.display = 'block';
  const l1=document.getElementById('ra-bulk-l1'), l2=document.getElementById('ra-bulk-l2'), f=document.getElementById('ra-bulk-fill');
  if (l1 && line1!=null) l1.textContent = line1;
  if (l2) l2.textContent = line2 || '';
  if (f && pct!=null) f.style.width = Math.max(0, Math.min(100, pct)) + '%';
}

// ── EXPORT PDF TUNGGAL (dari panel detail) ─────────────────────
async function exportPDF(){
  if (!CURRENT_ANAK) { alert('Pilih anak terlebih dahulu.'); return; }
  if (!(window.jspdf && window.jspdf.jsPDF)) { alert('Pustaka PDF belum termuat. Periksa koneksi internet lalu coba lagi.'); return; }

  const btn = document.getElementById('ra-pdf-btn');
  const lbl = document.getElementById('ra-pdf-lbl');
  const lblOrig = lbl ? lbl.textContent : '';
  if (btn) { btn.disabled = true; btn.querySelector('svg')?.setAttribute('style','opacity:.6'); }

  try {
    if (lbl) lbl.textContent = 'Menyiapkan data…';
    let a = CURRENT_ANAK, F = CURRENT_FORMS;
    try {
      const scn = (typeof AUTH!=='undefined' && AUTH.getScnFilter) ? AUTH.getScnFilter() : (CURRENT_ANAK.scn||null);
      if (window.API && API.clearCache) API.clearCache(scn);
      const d = (window.API && API.get) ? await API.get(scn) : null;
      if (d) { ALL_DATA = d; ({ a, F } = deriveForms(d, CURRENT_ANAK)); }
    } catch(e){ console.warn('[PDF] Gagal ambil data terbaru, memakai data termuat:', e.message); }
    if (lbl) lbl.textContent = 'Membuat PDF…';

    const doc = buildChildDoc(a, F);
    const now = new Date();
    const ymd = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    doc.save('Rekam_'+pdfSafeName(a.nama)+'_'+ymd+'.pdf');
  } catch(err){
    console.error('exportPDF error:', err);
    alert('Gagal membuat PDF: '+(err&&err.message?err.message:err));
  } finally {
    if (btn) { btn.disabled = false; btn.querySelector('svg')?.removeAttribute('style'); }
    if (lbl) lbl.textContent = lblOrig || 'Export PDF';
  }
}

// ── EXPORT MASSAL: ZIP induk → 1 zip per CBR worker → PDF anak ──
async function exportAllPDF(){
  if (!(window.jspdf && window.jspdf.jsPDF)) { alert('Pustaka PDF belum termuat. Periksa koneksi internet lalu coba lagi.'); return; }
  if (!window.JSZip) { alert('Pustaka ZIP belum termuat. Periksa koneksi internet lalu coba lagi.'); return; }

  const btn = document.getElementById('ra-bulk-btn');
  const lbl = document.getElementById('ra-bulk-lbl');
  const lblOrig = lbl ? lbl.textContent : '';
  if (btn) btn.disabled = true;

  try {
    bulkProgress(true, 0, 'Menyiapkan data terbaru…', '');

    // Ambil data terbaru (bypass cache)
    const scn = (typeof AUTH!=='undefined' && AUTH.getScnFilter) ? AUTH.getScnFilter() : null;
    let d = ALL_DATA;
    try {
      if (window.API && API.clearCache) API.clearCache(scn);
      const fresh = (window.API && API.get) ? await API.get(scn) : null;
      if (fresh) { d = fresh; ALL_DATA = fresh; }
    } catch(e){ console.warn('[BULK] Gagal ambil data terbaru, memakai data termuat:', e.message); }

    // Segarkan daftar & hormati filter yang aktif (CBR / ragam / pencarian)
    ALL_ANAK = filterByRole(buildUnionAnak(d));
    applyFilter();
    const targets = FILTERED.slice();
    if (!targets.length){ bulkProgress(false); alert('Tidak ada anak untuk diekspor pada filter saat ini.'); return; }

    // Kelompokkan per CBR worker
    const byWorker = {};
    targets.forEach(a => {
      const w = (a.cbr && a.cbr!=='—') ? a.cbr : 'Tanpa CBR Worker';
      (byWorker[w] || (byWorker[w]=[])).push(a);
    });

    const JSZip = window.JSZip;
    const master = new JSZip();
    const totalN = targets.length;
    let done = 0;

    for (const worker of Object.keys(byWorker).sort()){
      const kids = byWorker[worker];
      const wzip = new JSZip();
      for (const a0 of kids){
        const { a, F } = deriveForms(d, a0);
        const doc = buildChildDoc(a, F);
        wzip.file(pdfSafeName(a.nama)+'.pdf', doc.output('arraybuffer'));
        done++;
        bulkProgress(true, Math.round(done/totalN*100), 'Membuat PDF '+done+' / '+totalN, worker+' — '+(a.nama||''));
        await new Promise(r=>setTimeout(r, 0)); // yield ke UI agar tidak beku
      }
      const wblob = await wzip.generateAsync({ type:'arraybuffer', compression:'DEFLATE', compressionOptions:{ level:6 } });
      master.file(pdfSafeName(worker)+'.zip', wblob, { compression:'STORE' });
    }

    bulkProgress(true, 100, 'Mengemas ZIP induk…', '');
    const now = new Date();
    const ymd = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    const scnName = pdfSafeName((d && d.meta && d.meta.scn) || scn || 'SCN');
    const blob = await master.generateAsync({ type:'blob', compression:'STORE' });
    downloadBlob(blob, 'RekamAnak_'+scnName+'_'+ymd+'.zip');
    bulkProgress(false);
  } catch(err){
    console.error('exportAllPDF error:', err);
    bulkProgress(false);
    alert('Gagal membuat ZIP: '+(err&&err.message?err.message:err));
  } finally {
    if (btn) btn.disabled = false;
    if (lbl) lbl.textContent = lblOrig;
  }
}


// ── POPULATE FILTERS ───────────────────────────────────────────
// Map ragam → set detail ragam yang relevan
let RAGAM_DETAIL_MAP = {};

function populateFilters(anak) {
  // CBR Worker
  const cbrs = [...new Set(anak.map(a=>a.cbr).filter(c=>c&&c!=='—'))].sort();
  const cbrSel = document.getElementById('flt-cbr');
  cbrs.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    cbrSel.appendChild(opt);
  });

  // Bangun map: ragam → detail ragam yang relevan
  RAGAM_DETAIL_MAP = {};
  anak.forEach(a => {
    if (!a.ragam || a.ragam==='—') return;
    if (!RAGAM_DETAIL_MAP[a.ragam]) RAGAM_DETAIL_MAP[a.ragam] = new Set();
    (a.rgd||'').split(',').map(d=>d.trim()).filter(Boolean).forEach(d => {
      RAGAM_DETAIL_MAP[a.ragam].add(d);
    });
  });

  // Jika worker: set dan lock filter CBR
  if (MY_ROLE === 'worker' && MY_CBR) {
    cbrSel.value = MY_CBR;
    cbrSel.disabled = true;
    cbrSel.title = 'Filter dikunci untuk CBR Worker Anda';
  }
}

// Isi ulang dropdown detail sesuai ragam yang dipilih
function refreshDetailOptions(ragam) {
  const detSel = document.getElementById('flt-detail');
  detSel.innerHTML = '<option value="">Semua Detail Ragam</option>';
  if (!ragam) return;
  const details = [...(RAGAM_DETAIL_MAP[ragam]||new Set())].sort();
  details.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    detSel.appendChild(opt);
  });
}
